<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="meta-title">Ricardo Veronese - Lector de Bitácoras</title>
    <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon">
    <meta name="author" content="Ricardo Veronese">
    <link rel="alternate" type="application/rss+xml" title="Ricardo Veronese - Blog RSS Feed" href="https://riccivr.github.io/feed.xml">
    <link rel="help" type="text/markdown" title="Documentación para LLMs" href="https://riccivr.github.io/llms.txt">

    <!-- Open Graph Default -->
    <meta property="og:type" content="article">
    <meta property="og:site_name" content="Ricardo Veronese">
    <meta property="og:image" content="https://riccivr.github.io/riccivr-retro.png">

    <!-- Twitter Cards Default -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://riccivr.github.io/riccivr-retro.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/base16/monokai.min.css" id="hljs-dark-theme">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/base16/solarized-light.min.css" id="hljs-light-theme" disabled>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script>
        // Immediately apply saved or system theme and language to avoid FOUC
        (function() {
            const savedTheme = localStorage.getItem('riccivr-theme');
            const prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
            if (savedTheme === 'light' || (!savedTheme && prefersLight)) {
                document.documentElement.setAttribute('data-theme', 'light');
            } else {
                document.documentElement.removeAttribute('data-theme');
            }

            const savedLang = localStorage.getItem('riccivr-lang');
            const browserLang = (navigator.language || (navigator.languages && navigator.languages[0]) || '').toLowerCase();
            const activeLang = (savedLang === 'es' || savedLang === 'en') ? savedLang : (browserLang.startsWith('es') ? 'es' : 'en');
            document.documentElement.setAttribute('lang', activeLang);
        })();
    </script>
    <style>
        :root {
            --bg-page: #000000;
            --bg-frame: #000000;
            --bg-header: rgba(180, 83, 9, 0.2);
            --bg-card: rgba(69, 26, 3, 0.2);
            --bg-card-alt: rgba(69, 26, 3, 0.35);
            --bg-badge: rgba(245, 158, 11, 0.1);
            
            --border-primary: #f59e0b;
            --border-subtle: rgba(245, 158, 11, 0.5);
            --border-dim: rgba(245, 158, 11, 0.2);
            
            --text-title: #fef3c7;
            --text-heading: #fbbf24;
            --text-main: #f59e0b;
            --text-muted: #d97706;
            --text-dim: #92400e;
            --text-code: #fef3c7;
            --text-blockquote: #fde68a;
            
            --scanline-color: rgba(180, 150, 0, 0.07);
            --frame-shadow: 0 0 10px #f59e0b, 0 0 20px #f59e0b inset;
            --btn-hover-bg: #f59e0b;
            --btn-hover-text: #000000;
            
            --bg-code-block: #0d0a06;
            --bg-inline-code: rgba(245, 158, 11, 0.15);
            --bg-blockquote: rgba(180, 83, 9, 0.12);
            --bg-table-header: rgba(180, 83, 9, 0.25);
        }

        [data-theme="light"] {
            --bg-page: #f5efe1;
            --bg-frame: #fcf8f0;
            --bg-header: #ebe0ca;
            --bg-card: #f3ecdb;
            --bg-card-alt: #eae0cb;
            --bg-badge: rgba(146, 64, 14, 0.08);
            
            --border-primary: #92400e;
            --border-subtle: rgba(146, 64, 14, 0.5);
            --border-dim: rgba(146, 64, 14, 0.25);
            
            --text-title: #1a0a01;
            --text-heading: #78350f;
            --text-main: #2b1103;
            --text-muted: #612809;
            --text-dim: #92400e;
            --text-code: #581c87;
            --text-blockquote: #451a03;
            
            --scanline-color: rgba(146, 64, 14, 0.035);
            --frame-shadow: 0 3px 14px rgba(146, 64, 14, 0.18), 0 0 0 1px rgba(146, 64, 14, 0.12) inset;
            --btn-hover-bg: #92400e;
            --btn-hover-text: #fcf8f0;
            
            --bg-code-block: #f7f1e4;
            --bg-inline-code: #eeddc3;
            --bg-blockquote: #f0e6d2;
            --bg-table-header: #ebdcc0;
        }

        body {
            background-color: var(--bg-page);
            background-image: linear-gradient(var(--scanline-color) 1px, transparent 1px);
            background-size: 100% 4px;
            font-family: 'Courier New', Courier, monospace;
            color: var(--text-main);
            transition: background-color 0.15s ease, color 0.15s ease;
        }

        .terminal-frame {
            box-shadow: var(--frame-shadow);
            border: 2px solid var(--border-primary);
            background-color: var(--bg-frame);
        }

        .interactive-link {
            transition: color 0.1s ease, background-color 0.1s ease, border-color 0.1s ease;
            border-color: var(--border-primary);
            color: var(--text-main);
        }
        .interactive-link:hover {
            color: var(--btn-hover-text) !important;
            background-color: var(--btn-hover-bg) !important;
        }

        .theme-border { border-color: var(--border-primary); }
        .theme-border-subtle { border-color: var(--border-subtle); }
        .theme-border-dim { border-color: var(--border-dim); }

        .theme-bg-header { background-color: var(--bg-header); }
        .theme-bg-card { background-color: var(--bg-card); }
        .theme-bg-card-alt { background-color: var(--bg-card-alt); }

        .theme-text-title { color: var(--text-title); }
        .theme-text-heading { color: var(--text-heading); }
        .theme-text-main { color: var(--text-main); }
        .theme-text-muted { color: var(--text-muted); }
        .theme-text-dim { color: var(--text-dim); }

        /* Typography & Markdown Styles */
        #post-content h1 {
            font-size: 1.65rem;
            font-weight: 800;
            color: var(--text-title);
            margin-bottom: 0.75rem;
            border-bottom: 2px solid var(--border-primary);
            padding-bottom: 0.5rem;
            text-transform: uppercase;
        }
        #post-content h2 {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-heading);
            margin-top: 2rem;
            margin-bottom: 0.75rem;
            border-bottom: 1px dashed var(--border-subtle);
            padding-bottom: 0.3rem;
        }
        #post-content h3 {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-heading);
            margin-top: 1.5rem;
            margin-bottom: 0.5rem;
        }
        #post-content p {
            margin-bottom: 1.25rem;
            line-height: 1.7;
            color: var(--text-main);
        }
        #post-content ul, #post-content ol {
            margin-bottom: 1.25rem;
            padding-left: 1.5rem;
        }
        #post-content ul {
            list-style-type: square;
        }
        #post-content ol {
            list-style-type: decimal;
        }
        #post-content li {
            margin-bottom: 0.4rem;
            line-height: 1.6;
        }
        #post-content a {
            color: var(--text-heading);
            text-decoration: underline;
            font-weight: bold;
            transition: color 0.1s ease, background-color 0.1s ease;
        }
        #post-content a:hover {
            color: var(--btn-hover-text);
            background-color: var(--btn-hover-bg);
            text-decoration: none;
        }
        #post-content a code {
            color: inherit !important;
            background-color: transparent !important;
            border: none !important;
            text-decoration: underline;
            padding: 0 !important;
        }
        #post-content a:hover code {
            color: var(--btn-hover-text) !important;
            background-color: transparent !important;
        }
        #post-content code a {
            color: var(--text-heading) !important;
            text-decoration: underline;
        }
        #post-content code a:hover {
            color: var(--btn-hover-text) !important;
            background-color: var(--btn-hover-bg) !important;
        }
        #post-content blockquote {
            border-left: 3px solid var(--border-primary);
            background: var(--bg-blockquote);
            padding: 0.75rem 1rem;
            margin: 1.2rem 0;
            font-style: italic;
            color: var(--text-blockquote);
        }
        #post-content blockquote p {
            margin-bottom: 0;
            color: var(--text-blockquote);
        }
        #post-content hr {
            border: 0;
            border-top: 1px solid var(--border-subtle);
            margin: 2rem 0;
        }
        #post-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5rem 0;
            font-size: 0.85rem;
        }
        #post-content th, #post-content td {
            border: 1px solid var(--border-subtle);
            padding: 0.5rem 0.75rem;
            text-align: left;
        }
        #post-content th {
            background-color: var(--bg-table-header);
            color: var(--text-heading);
            font-weight: bold;
        }
        #post-content td {
            color: var(--text-main);
        }
        #post-content pre {
            background-color: var(--bg-code-block) !important;
            border: 1px solid var(--border-subtle);
            padding: 1rem;
            overflow-x: auto;
            margin: 1.2rem 0;
            border-radius: 2px;
        }
        #post-content pre code a {
            color: var(--text-heading) !important;
            text-decoration: underline;
        }
        #post-content code {
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.88rem;
        }
        #post-content p code, #post-content li code {
            background-color: var(--bg-inline-code);
            color: var(--text-code);
            padding: 0.1rem 0.3rem;
            border: 1px solid var(--border-dim);
            border-radius: 2px;
            font-weight: 600;
        }
    </style>
</head>
<body class="p-4 sm:p-8 md:p-12 min-h-screen">

    <div class="terminal-frame max-w-4xl mx-auto mt-4 rounded-lg overflow-hidden">

        <header class="p-3 theme-bg-header border-b theme-border flex flex-wrap justify-between items-center gap-2">
            <div class="flex items-center space-x-2">
                <span class="text-xs theme-text-muted tracking-wider font-bold" id="header-sys-id">ID.SISTEMA: riccivr // LECTOR_DE_BITÁCORAS</span>
            </div>
            <div class="flex items-center space-x-2 sm:space-x-3">
                <button id="lang-toggle" class="interactive-link border theme-border px-2.5 py-0.5 text-xs uppercase font-bold tracking-wider" title="Alternar idioma / Toggle Language [I]">
                    [LANG: ES]
                </button>
                <button id="keys-toggle" class="interactive-link border theme-border px-2.5 py-0.5 text-xs uppercase font-bold tracking-wider" title="Alternar atajos de navegación por teclado">
                    [TECLAS: ACT]
                </button>
                <button id="theme-toggle" class="interactive-link border theme-border px-2.5 py-0.5 text-xs uppercase font-bold tracking-wider" title="Alternar tema (CRT / Papel)">
                    [MODO: CRT]
                </button>
                <span id="status-label" class="theme-text-main text-xs sm:text-sm font-bold uppercase tracking-wider">

        <main class="p-6">

            <div class="flex flex-wrap items-center justify-between gap-3 pb-4 mb-6 border-b theme-border-subtle">

                    <a href="index.html" id="back-index-btn" class="interactive-link border theme-border px-3 py-1 text-xs uppercase font-bold">

                Renderizado con marked.js + highlight.js
            </span>
        </footer>

    </div>

    <script>
        const i18n = {
            es: {
                sysId: "ID.SISTEMA: riccivr // LECTOR_DE_BITÁCORAS",
                status: "ESTADO: EN LÍNEA",
                langToggle: "[LANG: ES]",
                keysOn: "[TECLAS: ACT]",
                keysOff: "[TECLAS: DES]",
                modeCrt: "[MODO: CRT]",
                modePaper: "[MODO: PAPEL]",
                backIndex: "[<] Volver al Índice",
                homePortal: "[H] Portal Principal",
                copyLink: "[S] Copiar Enlace",
                copied: "[✓] ¡Copiado!",
                repo: "[G] Repositorio",
                loading: "Obteniendo stream de Markdown desde el repositorio...",
                noPost: "[!] No se especificó ninguna bitácora.",
                browseAll: "[Explorar todas las bitácoras]",
                topBtn: "[^] Subir al Inicio",
                footerText: "Renderizado con marked.js + highlight.js"
            },
            en: {
                sysId: "SYS.ID: riccivr // LOG_VIEWER",
                status: "STATUS: ONLINE",
                langToggle: "[LANG: EN]",
                keysOn: "[KEYS: ON]",
                keysOff: "[KEYS: OFF]",
                modeCrt: "[MODE: CRT]",
                modePaper: "[MODE: PAPER]",
                backIndex: "[<] Return to Logs Index",
                homePortal: "[H] Home Portal",
                copyLink: "[S] Copy Link",
                copied: "[✓] Copied!",
                repo: "[G] Repo",
                loading: "Fetching markdown stream from repository...",
                noPost: "[!] No log entry specified.",
                browseAll: "[Browse all logs]",
                topBtn: "[^] Top of Page",
                footerText: "Rendered with marked.js + highlight.js"
            }
        };

        function getLanguage() {
            const saved = localStorage.getItem('riccivr-lang');
            if (saved === 'es' || saved === 'en') return saved;
            const browserLang = (navigator.language || (navigator.languages && navigator.languages[0]) || '').toLowerCase();
            return browserLang.startsWith('es') ? 'es' : 'en';
        }

        let currentLang = getLanguage();

        function applyLanguageUI() {
            const t = i18n[currentLang] || i18n.es;
            document.documentElement.setAttribute('lang', currentLang);

            document.getElementById('status-label').textContent = t.status;
            document.getElementById('lang-toggle').textContent = t.langToggle;

            const isLight = document.documentElement.getAttribute('data-theme') === 'light';
            document.getElementById('theme-toggle').textContent = isLight ? t.modePaper : t.modeCrt;

            const keysEnabled = localStorage.getItem('riccivr-keys') !== 'off';
            document.getElementById('keys-toggle').textContent = keysEnabled ? t.keysOn : t.keysOff;

            document.getElementById('back-index-btn').textContent = t.backIndex;
            document.getElementById('home-portal-btn').textContent = t.homePortal;
            document.getElementById('copy-link-btn').textContent = t.copyLink;
            document.getElementById('repo-btn').textContent = t.repo;
            document.getElementById('bottom-back-btn').textContent = t.backIndex;
            document.getElementById('bottom-top-btn').textContent = t.topBtn;
            document.getElementById('footer-text').textContent = t.footerText;
        }

        // Theme toggle handling
        const themeBtn = document.getElementById('theme-toggle');
        const darkHljs = document.getElementById('hljs-dark-theme');
        const lightHljs = document.getElementById('hljs-light-theme');
        
        function syncHljsTheme(isLight) {
            if (isLight) {
                darkHljs.disabled = true;
                lightHljs.disabled = false;
            } else {
                darkHljs.disabled = false;
                lightHljs.disabled = true;
            }
        }

        function updateThemeBtn() {
            const isLight = document.documentElement.getAttribute('data-theme') === 'light';
            const t = i18n[currentLang] || i18n.es;
            themeBtn.textContent = isLight ? t.modePaper : t.modeCrt;
            syncHljsTheme(isLight);
        }

        themeBtn.addEventListener('click', () => {
            const isLight = document.documentElement.getAttribute('data-theme') === 'light';
            const next = isLight ? 'dark' : 'light';
            if (next === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
            } else {
                document.documentElement.removeAttribute('data-theme');
            }
            localStorage.setItem('riccivr-theme', next);
            updateThemeBtn();
        });

        // Keyboard shortcuts toggle handling
        const keysToggleBtn = document.getElementById('keys-toggle');
        function areKeysEnabled() {
            return localStorage.getItem('riccivr-keys') !== 'off';
        }
        function updateKeysBtn() {
            if (!keysToggleBtn) return;
            const enabled = areKeysEnabled();
            const t = i18n[currentLang] || i18n.es;
            keysToggleBtn.textContent = enabled ? t.keysOn : t.keysOff;
            keysToggleBtn.style.opacity = enabled ? '1' : '0.6';
        }
        keysToggleBtn.addEventListener('click', () => {
            const currentlyEnabled = areKeysEnabled();
            const nextState = currentlyEnabled ? 'off' : 'on';
            localStorage.setItem('riccivr-keys', nextState);
            updateKeysBtn();
        });

        marked.setOptions({
            highlight: function(code, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    try {
                        return hljs.highlight(code, { language: lang }).value;
                    } catch (err) {}
                }
                return hljs.highlightAuto(code).value;
            },
            breaks: true,
            gfm: true
        });

        async function loadPost() {
            const urlParams = new URLSearchParams(window.location.search);
            const slug = urlParams.get('post');
            const loadingEl = document.getElementById('post-loading');
            const contentEl = document.getElementById('post-content');
            const t = i18n[currentLang] || i18n.es;

            if (!slug) {
                loadingEl.innerHTML = `
                    <div class="border theme-border-subtle p-4 theme-text-muted text-sm font-bold">
                        ${t.noPost} <a href="index.html" class="underline">${t.browseAll}</a>
                    </div>
                `;
                return;
            }

            loadingEl.textContent = t.loading;
            loadingEl.classList.remove('hidden');
            contentEl.classList.add('hidden');

            try {
                // Fetch post manifest to get file path and title
                const manifestRes = await fetch('posts.json');
                if (!manifestRes.ok) throw new Error('Failed to load posts index');
                const manifest = await manifestRes.json();
                const postEntry = manifest.find(p => p.slug === slug);

                const postMeta = postEntry ? (postEntry[currentLang] || postEntry['es'] || postEntry['en'] || postEntry) : null;
                
                // Determine file path: prefer localized file, fallback to standard
                let mdFile = `posts/${slug}.${currentLang}.md`;
                if (postMeta && postMeta.file) {
                    mdFile = postMeta.file;
                }

                let mdRes = await fetch(mdFile);
                if (!mdRes.ok) {
                    // Fallback to non-localized or alternate
                    mdRes = await fetch(`posts/${slug}.md`);
                }
                if (!mdRes.ok) throw new Error(`Log file "${slug}" not found`);

                const markdownText = await mdRes.text();
                contentEl.innerHTML = marked.parse(markdownText);
                
                if (postMeta && postMeta.title) {
                    document.title = `${postMeta.title} - Ricardo Veronese`;
                    document.getElementById('header-sys-id').textContent = `SYS.ID: riccivr // ${postEntry.slug}`;

                    // Inject Schema.org TechArticle JSON-LD
                    const existingSchema = document.getElementById('post-schema');
                    if (existingSchema) existingSchema.remove();
                    const schemaScript = document.createElement('script');
                    schemaScript.id = 'post-schema';
                    schemaScript.type = 'application/ld+json';
                    schemaScript.textContent = JSON.stringify({
                        "@context": "https://schema.org",
                        "@type": "TechArticle",
                        "headline": postMeta.title,
                        "description": postMeta.summary,
                        "datePublished": postEntry.date,
                        "dateModified": postEntry.date,
                        "author": {
                            "@type": "Person",
                            "name": "Ricardo Veronese",
                            "url": "https://riccivr.github.io/"
                        },
                        "publisher": {
                            "@type": "Person",
                            "name": "Ricardo Veronese"
                        },
                        "mainEntityOfPage": window.location.href,
                        "keywords": (postMeta.tags || []).join(", ")
                    });
                    document.head.appendChild(schemaScript);
                }

                loadingEl.classList.add('hidden');
                contentEl.classList.remove('hidden');

                // Highlight code blocks
                document.querySelectorAll('pre code').forEach((block) => {
                    hljs.highlightElement(block);
                });
            } catch (err) {
                loadingEl.innerHTML = `
                    <div class="border border-red-500/50 p-4 text-red-500 text-sm font-bold">
                        [ERROR] ${err.message}<br>
                        <a href="index.html" class="interactive-link border theme-border px-2 py-1 mt-3 inline-block text-xs uppercase">${t.backIndex}</a>
                    </div>
                `;
            }
        }

        document.getElementById('copy-link-btn').addEventListener('click', () => {
            const t = i18n[currentLang] || i18n.es;
            navigator.clipboard.writeText(window.location.href).then(() => {
                const btn = document.getElementById('copy-link-btn');
                const prev = btn.textContent;
                btn.textContent = t.copied;
                setTimeout(() => { btn.textContent = prev; }, 2000);
            });
        });

        function flashElement(el) {
            if (!el) return;
            const prevBg = el.style.backgroundColor;
            const prevColor = el.style.color;
            el.style.backgroundColor = 'var(--btn-hover-bg)';
            el.style.color = 'var(--btn-hover-text)';
            setTimeout(() => {
                el.style.backgroundColor = prevBg;
                el.style.color = prevColor;
            }, 200);
        }

        document.addEventListener('DOMContentLoaded', () => {
            applyLanguageUI();
            updateThemeBtn();
            updateKeysBtn();

            const langBtn = document.getElementById('lang-toggle');
            langBtn.addEventListener('click', () => {
                currentLang = currentLang === 'es' ? 'en' : 'es';
                localStorage.setItem('riccivr-lang', currentLang);
                applyLanguageUI();
                loadPost();
            });

            // Global keyboard shortcut dispatcher
            document.addEventListener('keydown', (e) => {
                if (!areKeysEnabled()) {
                    return;
                }
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable) {
                    return;
                }
                if (e.ctrlKey || e.metaKey || e.altKey) {
                    return;
                }

                const key = e.key.toUpperCase();

                if (key === 'I') {
                    flashElement(langBtn);
                    langBtn.click();
                } else if (key === 'B' || key === '<' || key === '[' || e.key === 'Escape') {
                    const backBtn = document.querySelector('a[href="index.html"]');
                    flashElement(backBtn);
                    setTimeout(() => { window.location.href = 'index.html'; }, 150);
                } else if (key === 'H') {
                    const homeBtn = document.querySelector('a[href="../"]');
                    flashElement(homeBtn);
                    setTimeout(() => { window.location.href = '../'; }, 150);
                } else if (key === 'S') {
                    const copyBtn = document.getElementById('copy-link-btn');
                    flashElement(copyBtn);
                    copyBtn.click();
                } else if (key === 'G') {
                    const repoBtn = document.querySelector('a[href*="github.com"]');
                    flashElement(repoBtn);
                    window.open('https://github.com/riccivr/riccivr.github.io', '_blank');
                } else if (key === 'T') {
                    flashElement(themeBtn);
                    themeBtn.click();
                } else if (key === '^' || key === 'K' || e.key === 'ArrowUp') {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            });

            loadPost();
        });
    </script>
</body>
</html>
