<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ricardo Veronese - Blog Post</title>
    <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/base16/monokai.min.css" id="hljs-dark-theme">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/base16/solarized-light.min.css" id="hljs-light-theme" disabled>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script>
        // Immediately apply saved or system theme to avoid FOUC
        (function() {
            const saved = localStorage.getItem('riccivr-theme');
            const prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
            if (saved === 'light' || (!saved && prefersLight)) {
                document.documentElement.setAttribute('data-theme', 'light');
            } else {
                document.documentElement.removeAttribute('data-theme');
            }
        })();
    </script>
    <style>
        :root {
            --bg-page: #000000;
            --bg-frame: #000000;
            --bg-header: rgba(180, 83, 9, 0.2);
            --bg-card: rgba(69, 26, 3, 0.2);
            --bg-blockquote: rgba(120, 53, 15, 0.2);
            --bg-code-block: #0a0805;
            --bg-inline-code: rgba(180, 83, 9, 0.3);
            --bg-table-header: rgba(180, 83, 9, 0.3);
            
            --border-primary: #f59e0b;
            --border-subtle: rgba(245, 158, 11, 0.5);
            --border-dim: rgba(245, 158, 11, 0.2);
            
            --text-title: #fef3c7;
            --text-heading: #fbbf24;
            --text-main: #f59e0b;
            --text-muted: #d97706;
            --text-dim: #92400e;
            --text-blockquote: #fde68a;
            --text-code: #fcd34d;
            
            --scanline-color: rgba(180, 150, 0, 0.07);
            --frame-shadow: 0 0 10px #f59e0b, 0 0 20px #f59e0b inset;
            --btn-hover-bg: #f59e0b;
            --btn-hover-text: #000000;
        }

        [data-theme="light"] {
            --bg-page: #f5efe1;
            --bg-frame: #fcf8f0;
            --bg-header: #ebe0ca;
            --bg-card: #f3ecdb;
            --bg-blockquote: #efe5ce;
            --bg-code-block: #f3ecdb;
            --bg-inline-code: #eae0cb;
            --bg-table-header: #ebe0ca;
            
            --border-primary: #92400e;
            --border-subtle: rgba(146, 64, 14, 0.5);
            --border-dim: rgba(146, 64, 14, 0.25);
            
            --text-title: #1a0a01;
            --text-heading: #78350f;
            --text-main: #2b1103;
            --text-muted: #612809;
            --text-dim: #92400e;
            --text-blockquote: #451a03;
            --text-code: #612809;
            
            --scanline-color: rgba(146, 64, 14, 0.035);
            --frame-shadow: 0 3px 14px rgba(146, 64, 14, 0.18), 0 0 0 1px rgba(146, 64, 14, 0.12) inset;
            --btn-hover-bg: #92400e;
            --btn-hover-text: #fcf8f0;
        }

        body {
            background-color: var(--bg-page);
            background-image: linear-gradient(var(--scanline-color) 1px, transparent 1px);
            background-size: 100% 4px;
            font-family: 'Courier New', Courier, monospace;
            color: var(--text-main);
            transition: background-color 0.15s ease, color 0.15s ease;
        }

        .terminal-frame {
            box-shadow: var(--frame-shadow);
            border: 2px solid var(--border-primary);
            background-color: var(--bg-frame);
        }

        .interactive-link {
            transition: color 0.1s ease, background-color 0.1s ease, border-color 0.1s ease;
            border-color: var(--border-primary);
            color: var(--text-main);
        }
        .interactive-link:hover {
            color: var(--btn-hover-text) !important;
            background-color: var(--btn-hover-bg) !important;
        }

        .theme-border { border-color: var(--border-primary); }
        .theme-border-subtle { border-color: var(--border-subtle); }
        .theme-border-dim { border-color: var(--border-dim); }
        .theme-bg-header { background-color: var(--bg-header); }
        .theme-text-muted { color: var(--text-muted); }
        .theme-text-dim { color: var(--text-dim); }

        /* Markdown rendered content styles */
        #post-content h1 {
            color: var(--text-title);
            font-size: 1.6rem;
            font-weight: bold;
            margin-top: 1.5rem;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border-subtle);
            text-transform: uppercase;
        }
        #post-content h2 {
            color: var(--text-heading);
            font-size: 1.3rem;
            font-weight: bold;
            margin-top: 1.8rem;
            margin-bottom: 0.75rem;
            border-bottom: 1px dashed var(--border-subtle);
            padding-bottom: 0.25rem;
        }
        #post-content h3 {
            color: var(--text-heading);
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 1.4rem;
            margin-bottom: 0.5rem;
        }
        #post-content p {
            color: var(--text-main);
            line-height: 1.7;
            margin-bottom: 1.2rem;
            font-size: 0.95rem;
        }
        #post-content ul, #post-content ol {
            margin-left: 1.5rem;
            margin-bottom: 1.2rem;
            color: var(--text-main);
            font-size: 0.95rem;
        }
        #post-content ul {
            list-style-type: none;
        }
        #post-content ul li::before {
            content: "> ";
            color: var(--border-primary);
            font-weight: bold;
        }
        #post-content ol {
            list-style-type: decimal;
        }
        #post-content li {
            margin-bottom: 0.4rem;
            line-height: 1.6;
        }
        #post-content a {
            color: var(--text-heading);
            text-decoration: underline;
            text-underline-offset: 3px;
            font-weight: bold;
        }
        #post-content a:hover {
            color: var(--btn-hover-text);
            background-color: var(--btn-hover-bg);
        }
        #post-content blockquote {
            border-left: 3px solid var(--border-primary);
            background: var(--bg-blockquote);
            padding: 0.75rem 1rem;
            margin: 1.2rem 0;
            font-style: italic;
            color: var(--text-blockquote);
        }
        #post-content blockquote p {
            margin-bottom: 0;
            color: var(--text-blockquote);
        }
        #post-content hr {
            border: 0;
            border-top: 1px solid var(--border-subtle);
            margin: 2rem 0;
        }
        #post-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5rem 0;
            font-size: 0.85rem;
        }
        #post-content th, #post-content td {
            border: 1px solid var(--border-subtle);
            padding: 0.5rem 0.75rem;
            text-align: left;
        }
        #post-content th {
            background-color: var(--bg-table-header);
            color: var(--text-heading);
            font-weight: bold;
        }
        #post-content td {
            color: var(--text-main);
        }
        #post-content pre {
            background-color: var(--bg-code-block) !important;
            border: 1px solid var(--border-subtle);
            padding: 1rem;
            overflow-x: auto;
            margin: 1.2rem 0;
            border-radius: 2px;
        }
        #post-content code {
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.88rem;
        }
        #post-content p code, #post-content li code {
            background-color: var(--bg-inline-code);
            color: var(--text-code);
            padding: 0.1rem 0.3rem;
            border: 1px solid var(--border-dim);
            border-radius: 2px;
            font-weight: 600;
        }
    </style>
</head>
<body class="p-4 sm:p-8 md:p-12 min-h-screen">

    <div class="terminal-frame max-w-4xl mx-auto mt-4 rounded-lg overflow-hidden">

        <header class="p-3 theme-bg-header border-b theme-border flex flex-wrap justify-between items-center gap-2">
            <div class="flex items-center space-x-2">
                <span class="text-xs theme-text-muted tracking-wider font-bold" id="header-sys-id">SYS.ID: riccivr // LOG_VIEWER</span>
            </div>
            <div class="flex items-center space-x-3">
                <button id="theme-toggle" class="interactive-link border theme-border px-2.5 py-0.5 text-xs uppercase font-bold tracking-wider" title="Toggle Theme (CRT / Paper)">
                    [MODE: CRT]
                </button>
                <span class="theme-text-main text-xs sm:text-sm font-bold uppercase tracking-wider">
                    STATUS: ONLINE
                </span>
            </div>
        </header>

        <main class="p-6">

            <!-- Navigation Controls -->
            <div class="flex flex-wrap items-center justify-between gap-3 pb-4 mb-6 border-b theme-border-subtle">
                <div class="flex space-x-2">
                    <a href="index.html" class="interactive-link border theme-border px-3 py-1 text-xs uppercase font-bold">
                        [<] Return to Logs Index
                    </a>
                    <a href="../" class="interactive-link border theme-border px-3 py-1 text-xs uppercase font-bold">
                        [H] Home Portal
                    </a>
                </div>
                <div class="flex space-x-2">
                    <button id="copy-link-btn" class="interactive-link border theme-border px-3 py-1 text-xs uppercase font-bold">
                        [S] Copy Link
                    </button>
                    <a href="https://github.com/riccivr/riccivr.github.io" target="_blank" class="interactive-link border theme-border px-3 py-1 text-xs uppercase font-bold">
                        [G] Repo
                    </a>
                </div>
            </div>

            <!-- Post Container -->
            <article id="post-article">
                <div id="post-loading" class="theme-text-muted text-sm animate-pulse p-6 text-center font-bold">
                    Fetching markdown stream from repository...
                </div>
                
                <div id="post-content" class="hidden"></div>
            </article>

            <!-- Bottom Return Navigation -->
            <div class="mt-8 pt-4 border-t theme-border-subtle flex justify-between items-center">
                <a href="index.html" class="interactive-link border theme-border px-3 py-1 text-xs uppercase font-bold">
                    [<] Back to Index
                </a>
                <a href="#" onclick="window.scrollTo({top: 0, behavior: 'smooth'}); return false;" class="interactive-link border theme-border px-3 py-1 text-xs uppercase font-bold">
                    [^] Top of Page
                </a>
            </div>

        </main>

        <footer class="p-4 border-t theme-border text-sm flex justify-between items-center theme-bg-header">
            <span class="theme-text-muted text-xs font-bold">riccivr.github.io/blog</span>
            <span class="text-right text-xs theme-text-muted font-medium">
                Rendered with marked.js + highlight.js
            </span>
        </footer>

    </div>

    <script>
        // Theme toggle handling
        const themeBtn = document.getElementById('theme-toggle');
        const darkHljs = document.getElementById('hljs-dark-theme');
        const lightHljs = document.getElementById('hljs-light-theme');
        
        function syncHljsTheme(isLight) {
            if (isLight) {
                darkHljs.disabled = true;
                lightHljs.disabled = false;
            } else {
                darkHljs.disabled = false;
                lightHljs.disabled = true;
            }
        }

        function updateThemeBtn() {
            const isLight = document.documentElement.getAttribute('data-theme') === 'light';
            themeBtn.textContent = isLight ? '[MODE: PAPER / LIGHT]' : '[MODE: CRT / DARK]';
            syncHljsTheme(isLight);
        }

        themeBtn.addEventListener('click', () => {
            const isLight = document.documentElement.getAttribute('data-theme') === 'light';
            const next = isLight ? 'dark' : 'light';
            if (next === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
            } else {
                document.documentElement.removeAttribute('data-theme');
            }
            localStorage.setItem('riccivr-theme', next);
            updateThemeBtn();
        });

        updateThemeBtn();

        marked.setOptions({
            highlight: function(code, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    try {
                        return hljs.highlight(code, { language: lang }).value;
                    } catch (err) {}
                }
                return hljs.highlightAuto(code).value;
            },
            breaks: true,
            gfm: true
        });

        async function loadPost() {
            const urlParams = new URLSearchParams(window.location.search);
            const slug = urlParams.get('post');
            const loadingEl = document.getElementById('post-loading');
            const contentEl = document.getElementById('post-content');

            if (!slug) {
                loadingEl.innerHTML = `
                    <div class="border theme-border-subtle p-4 theme-text-muted text-sm font-bold">
                        [!] No log entry specified. <a href="index.html" class="underline">[Browse all logs]</a>
                    </div>
                `;
                return;
            }

            try {
                // Fetch post manifest to get file path and title
                const manifestRes = await fetch('posts.json');
                if (!manifestRes.ok) throw new Error('Failed to load posts index');
                const manifest = await manifestRes.json();
                const postMeta = manifest.find(p => p.slug === slug);

                const mdFile = postMeta ? postMeta.file : `posts/${slug}.md`;
                const mdRes = await fetch(mdFile);
                if (!mdRes.ok) throw new Error(`Log file "${slug}.md" not found`);

                const markdownText = await mdRes.text();
                contentEl.innerHTML = marked.parse(markdownText);
                
                if (postMeta && postMeta.title) {
                    document.title = `${postMeta.title} - Ricardo Veronese`;
                    document.getElementById('header-sys-id').textContent = `SYS.ID: riccivr // ${postMeta.slug}`;
                }

                loadingEl.classList.add('hidden');
                contentEl.classList.remove('hidden');

                // Highlight code blocks
                document.querySelectorAll('pre code').forEach((block) => {
                    hljs.highlightElement(block);
                });
            } catch (err) {
                loadingEl.innerHTML = `
                    <div class="border border-red-500/50 p-4 text-red-500 text-sm font-bold">
                        [ERROR] Failed to load log entry: ${err.message}<br>
                        <a href="index.html" class="interactive-link border theme-border px-2 py-1 mt-3 inline-block text-xs uppercase">[<] Return to Index</a>
                    </div>
                `;
            }
        }

        document.getElementById('copy-link-btn').addEventListener('click', () => {
            navigator.clipboard.writeText(window.location.href).then(() => {
                const btn = document.getElementById('copy-link-btn');
                const prev = btn.textContent;
                btn.textContent = '[✓] Copied!';
                setTimeout(() => { btn.textContent = prev; }, 2000);
            });
        });

        loadPost();
    </script>
</body>
</html>
